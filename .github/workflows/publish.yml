name: Geprueftes Windows-Update veroeffentlichen
on:
  push:
    branches: [main]
    paths: ['delivery.json']
permissions:
  contents: write
concurrency:
  group: publish-update
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Installer pruefen und Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish.py
